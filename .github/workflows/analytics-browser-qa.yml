name: Analytics consent browser QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/layouts/BaseLayout.astro'
      - 'src/components/AnalyticsConsent.astro'
      - 'public/growth-measurement.js'
      - 'scripts/check-analytics-browser.mjs'
      - '.github/workflows/analytics-browser-qa.yml'

permissions:
  contents: read

jobs:
  consent-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build static website
        run: |
          npm install
          npm run build

      - name: Install browser QA runner only
        run: npm install --no-save puppeteer-core@24.20.0

      - name: Run Chrome network consent and retailer event QA
        run: node scripts/check-analytics-browser.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
