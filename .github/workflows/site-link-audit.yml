name: External link audit (review only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'docs/**'
      - '.github/workflows/site-link-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Report broken outbound links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Check links in generated HTML
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Outbound-link failures are advisory: Amazon/Etsy sometimes block bots.
          # Do not treat a rate limit or 403 as proof a product link is broken.
          args: >-
            --no-progress
            --root-dir ./dist
            --timeout 15
            --max-retries 1
            --exclude '^https://mercerlanepress\.com'
            './dist/**/*.html'
          output: lychee/report.md
          jobSummary: false
          fail: false

      - name: Upload audit report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbound-link-audit
          path: lychee/report.md
          if-no-files-found: warn
