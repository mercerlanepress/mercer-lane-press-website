name: Full site check

on:
  push:
    branches:
      - book/ham-radio-technician-exam-prep-2026-2030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Run full site validation
        run: npm run check
