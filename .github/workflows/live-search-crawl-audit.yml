name: Live search crawlability audit (review only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/check-live-crawlability.mjs
      - .github/workflows/live-search-crawl-audit.yml

permissions:
  contents: read

jobs:
  verify-public-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify public origin, robots, sitemap, and sampled URLs
        run: node scripts/check-live-crawlability.mjs
